<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PLL LOT Liveries Project</title>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body>

<header class="topbar">
  <img src="assets/logo.png" class="logo"/>
  <h1>PLL LOT Liveries Project</h1>
</header>

<section class="controls">
  <input type="text" id="search" placeholder="Szukaj livery..."/>

  <select id="filterAircraft">
    <option value="all">Wszystkie samoloty</option>
    <option value="A320">Airbus A320</option>
    <option value="B737">Boeing 737</option>
    <option value="B787">Boeing 787</option>
  </select>

  <select id="filterType">
    <option value="all">Wszystkie typy</option>
    <option value="real">Realne PLL LOT</option>
    <option value="fictional">Fictional</option>
  </select>
</section>

<main>
  <div id="liveryGrid" class="grid"></div>
</main>

<script src="app.js"></script>
</body>
</html>
